services:
  # База данных
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Java-приложение: создаёт таблицу и вставляет данные
  java-app:
    build: ./java-app
    environment:
      DB_URL: jdbc:postgresql://db:5432/mydb
      DB_USER: user
      DB_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy

  # Python/Flask: читает данные из БД и отдаёт на :5000
  python-app:
    build: ./python-app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mydb
      DB_USER: user
      DB_PASSWORD: password
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: